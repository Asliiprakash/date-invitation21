<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>A Little Question For You ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Floating hearts -->

    <div class="hearts">

        <span>❤️</span>
        <span>💕</span>
        <span>💗</span>
        <span>💖</span>
        <span>🌸</span>
        <span>❤️</span>
        <span>💗</span>
        <span>💕</span>

    </div>


    <!-- Main card -->

    <main class="container">

        <div class="card">

            <div class="top-heart">
                ❤️
            </div>


            <p class="small-title">
                A LITTLE QUESTION...
            </p>


            <h1>
                Hey You 🌸
            </h1>


            <p class="intro">

                I wanted to ask you something...

            </p>


            <div class="divider">
                ✦
            </div>


            <h2>

                Would you like to go
                <br>
                on a date with me? 🌹

            </h2>


            <p class="message">

                There's no pressure and no right or wrong answer.
                <br>
                Just be honest with me. ❤️

            </p>


            <div class="buttons">

                <button
                    id="yesBtn"
                    class="btn yes">

                    💖 Yes, I'd love to

                </button>


                <button
                    id="maybeBtn"
                    class="btn maybe">

                    😊 Maybe

                </button>


                <button
                    id="noBtn"
                    class="btn no">

                    🙈 No

                </button>

            </div>


            <p class="footer-text">

                Whatever your answer,
                <br>
                I'll respect it. 🌷

            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
